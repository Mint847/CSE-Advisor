[project]
name = "cse-advisor"
version = "0.1.0"
description = "Personal Colombo Stock Exchange analysis & recommendation web app"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "pandas",
  "numpy",
  "scipy",
  "httpx",
  "apscheduler",
  "pyyaml",
  "tzdata",
  "matplotlib",
  "mplfinance",
  "six",
  "python-dotenv",
  "pypdf",
  "pyjwt[crypto]>=2.8",   # verifying Firebase ID tokens (sign-in)
  "gs-quant==2.2.5",      # Goldman Sachs' quant maths (offline parts only), pinned: the QNT figures are tested against it
  "wrapt==2.5.2",         # a gs-quant dependency would otherwise pull a pre-release
  "openpyxl",             # reading the CBSL Excel tables (T-bill rate)
]

[project.optional-dependencies]
dev = ["pytest"]
llm = ["anthropic>=2"]    # Claude reads the news headlines (llm.enabled in settings.yaml)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
