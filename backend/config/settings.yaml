# CSE Advisor settings. Edit and restart the backend to apply.

market:
  timezone: Asia/Colombo
  open: "09:30"
  close: "14:30"
  eod_job_time: "15:30"          # analysis runs after the close
  live_poll_seconds: 60           # live quote refresh while a chart is open
  # CSE tick sizes (verified empirically 2026-11-02): < Rs100 -> 0.10, >= Rs100 -> 0.25
  tick_sizes:
    - {below: 100, tick: 0.10}
    - {below: 1000000000000, tick: 0.25}

costs:
  brokerage_pct_per_side: 1.12    # set to your broker's actual all-in rate
  slippage_pct: 0.20

risk:
  capital_lkr: 1000000            # your trading capital, used for position sizing
  risk_per_trade_pct: 1.0         # % of capital lost if the stop is hit
  max_position_pct: 20.0          # max % of capital in one stock
  max_days_to_exit: 3             # position must be sellable within N days at 20% of avg volume
  adv_participation: 0.20

signals:
  buy_score: 70
  watch_score: 55
  exit_score: 45
  min_reward_risk: 2.0
  min_liquidity_grade: C

weights:                          # composite score weights (sum = 1)
  trend_pattern: 0.35
  liquidity: 0.25
  fundamentals: 0.15
  news: 0.15
  macro: 0.10

fundamentals:                     # figures read from the quarterly statement PDFs (rules, no LLM)
  auto_reports: 6                 # newest quarters to read per stock (each also gives the same quarter a year earlier)

news_feeds:                       # headlines (free RSS: Sri Lankan papers, CBSL, Google News); lightly weighted, never a red flag
  enabled: true
  max_age_hours: 3                # fetch again when the last fetch is older than this (page visits) + every evening
  google: true                    # the evening job also searches Google News for each tracked company and world themes
  google_max_queries: 40          # company searches per evening (~1.5 s apart)
  google_window_days: 7
  aliases:                        # extra names a headline may use (matched on word boundaries; full names and tickers are automatic)
    COMB: ["Commercial Bank"]
    SAMP: ["Sampath Bank"]
    LOLC: ["LOLC Holdings"]
    RIL: ["RIL Property"]

history:                          # multi-year daily history (cse.lk gives one year)
  tradingview: true               # older daily bars from TradingView (already adjusted for rights/bonus/splits)
  tv_bars: 5000                   # back to ~2012 for most stocks
  analysis_bars: 2000             # the engines use the most recent N daily bars (~8 years)

intraday:                         # 1m / 5m / 15m / 1H / 4H charts (engines run on demand on the stock page)
  tradingview: true               # backfill history from TradingView (unofficial, anonymous; may stop working)
  tv_bars: 5000                   # bars per timeframe on the first backfill (~4 months of 5m, ~13 of 15m)
  tv_refresh_bars: 300            # bars per timeframe on the nightly top-up
  analysis_bars: 1500             # the engines look at the most recent N completed bars
  live_refresh_seconds: 60        # re-read today's cse.lk trades at most this often while a chart is open

screener:                         # SCR: daily ranking of all liquid CSE stocks (shown only; never changes a verdict)
  enabled: true
  min_median_turnover_lkr: 2000000   # 60-session median daily turnover; thinner stocks are left out
  universe_refresh_days: 14       # how often the full list is re-checked for liquidity (~15 min of TradingView requests)
  bars: 400                       # daily bars fetched per stock each evening

backup:
  keep: 14                        # nightly copies of the database kept in data/backups
  offsite_dir: ""                 # once a week the newest backup is zipped into this folder (the newest 8 are kept).
                                  # "" = a CSE-Advisor-backups folder in your OneDrive if you have one; "off" = never

accounts:                         # only when sign-in is on (FIREBASE_PROJECT_ID in .env); the admin has no limits
  max_watchlist: 30               # stocks per account (each one is fetched and analysed every evening)
  max_positions: 200              # position rows per account, open and closed
  max_lists: 10                   # named watchlists per account
  max_alerts: 100                 # your own alert rules per account
  max_notes: 2000                 # notes per account

smc:                              # SMC engine (order blocks, premium/discount, FVG, sweeps)
  buy_score: 55                   # minimum SMC score for a BUY
  swing_len: 3                    # a daily swing high/low must beat this many bars on each side

fibonacci:
  scale: log                     # log matches TradingView log charts (and the SLEG levels); or linear

valuation:
  market_pe: 11.0                 # CSE market P/E: update from the CSE daily market report
  market_pbv: 1.2                 # CSE market P/BV
  pe_band: [8, 11, 14]            # low / mid / high P/E applied to core EPS
  nav_band: [0.5, 0.75, 1.0]      # low / mid / high multiple of NAV (book value) per share

patterns:
  default_display: top5           # top5 | high | all
  candle_half_life_bars: 5
  chart_half_life_bars: 20
  estimated_open_penalty: 0.6     # history before we started recording real opens

telegram:
  enabled: true                   # needs TELEGRAM_TOKEN and TELEGRAM_CHAT_ID in .env
  daily_digest: true
  intraday_level_alerts: true

llm:                              # Claude reads the news headlines (news_llm.py); off = the keyword reader
  enabled: false                  # optional pay-per-use (about a cent a night); needs ANTHROPIC_API_KEY in .env or `ant auth login`
  model: claude-haiku-5-5
  max_headlines_per_day: 300      # hard cap on headlines sent per day
  days: 3                         # read headlines published in the last N days that it has not read yet

macro:                            # world series from TradingView, shown on MKT and in the journal; no score uses them
  enabled: true
  shock_us_pct: -2.0              # overnight note when the Nasdaq-100 or S&P 500 closed at least this much down
  shock_oil_pct: 5.0              # ... or Brent moved this much either way

global_stocks:                    # GLB page: world stocks (NVIDIA, SK Hynix...), prices and news from TradingView / Google News
  enabled: true
  job_time: "07:00"               # Colombo time, after the US close; caught up hourly if missed
  move_pct: 4.0                   # a "big move": a close-to-close change of at least this many %
  move_news_days: 365             # how far back big moves are listed with their headlines
  move_news_per_night: 3          # older moves whose headlines are searched each night (more are searched when you open a stock)
  history_bars: 1500              # daily bars fetched the first time (about 6 years)
  quote_cache_seconds: 120        # the list's quotes are re-read at most this often (TradingView's free feed is delayed 15-20 min)
