  bullish_harami:          {name: "Bullish harami",            tier: 2, enabled: true, base_reliability: 0.50}
  bearish_harami:          {name: "Bearish harami",            tier: 2, enabled: true, base_reliability: 0.50}
  hammer:                  {name: "Hammer",                    tier: 3, enabled: true, base_reliability: 0.52}
  hanging_man:             {name: "Hanging man",               tier: 3, enabled: true, base_reliability: 0.48}
